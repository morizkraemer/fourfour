[package]
name = "ffproto"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[workspace]
members = ["rbref"]

[lib]
name = "ffcore"
path = "src/lib.rs"

[dependencies]
beat-this = { version = "=1.1.0", default-features = false, features = ["decode", "serde"] }
symphonia = { version = "0.6", features = ["all"] }
rustfft = "6.2"
serde_json = "1"
rten = "=0.24.0"
rten-tensor = "=0.24.0"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
