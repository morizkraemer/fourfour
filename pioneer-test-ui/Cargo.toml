[package]
name = "pioneer-test-ui"
version = "0.1.0"
edition = "2024"
default-run = "pioneer-test-ui"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pioneer_usb_writer = { path = "../pioneer-usb-writer", package = "pioneer-usb-writer" }
pioneer_library = { path = "../pioneer-library", package = "pioneer-library" }
anyhow = "1"
tokio = { version = "1.52.1", features = ["rt", "process", "time", "macros"] }
cpal = "0.15"
fourfour-stretch = { path = "../fourfour-stretch" }
ringbuf = "0.4"
symphonia = { version = "0.5", features = ["all"] }
image = "0.25.10"
fourfour-analysis-rs = { path = "../fourfour-analysis-rs" }

[[bin]]
name = "waveform_dev"
path = "src/bin/waveform_dev.rs"

[[bin]]
name = "waveform_ab"
path = "src/bin/waveform_ab.rs"

[[bin]]
name = "waveform_grid"
path = "src/bin/waveform_grid.rs"

[[bin]]
name = "bench_analysis"
path = "src/bin/bench_analysis.rs"

[[bin]]
name = "bench_startup"
path = "src/bin/bench_startup.rs"

[[bin]]
name = "waveform_fixtures"
path = "src/bin/waveform_fixtures.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
fourfour-stretch = { path = "../fourfour-stretch", features = ["count-allocs"] }
