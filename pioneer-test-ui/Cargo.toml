[package]
name = "pioneer-test-ui"
version = "0.1.0"
edition = "2024"
default-run = "pioneer-test-ui"
autobins = false

[features]
dev-bins = []
ort = ["fourfour-analysis-rs/ort"]
coreml = ["fourfour-analysis-rs/coreml"]

[[bin]]
name = "pioneer-test-ui"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pioneer_usb_writer = { path = "../pioneer-usb-writer", package = "pioneer-usb-writer" }
pioneer_library = { path = "../pioneer-library", package = "pioneer-library" }
anyhow = "1"
lofty = "0.24"
chrono = "0.4"
tokio = { version = "1.52.1", features = ["rt", "process", "time", "macros"] }
cpal = "0.15"
fourfour-stretch = { path = "../fourfour-stretch" }
ringbuf = "0.4"
symphonia = { version = "0.5", features = ["all"] }
image = "0.25.10"
fourfour-analysis-rs = { path = "../fourfour-analysis-rs" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "waveform_dev"
path = "src/dev_bin/waveform_dev.rs"
required-features = ["dev-bins"]

[[bin]]
name = "waveform_ab"
path = "src/dev_bin/waveform_ab.rs"
required-features = ["dev-bins"]

[[bin]]
name = "waveform_grid"
path = "src/dev_bin/waveform_grid.rs"
required-features = ["dev-bins"]

[[bin]]
name = "bench_analysis"
path = "src/dev_bin/bench_analysis.rs"
required-features = ["dev-bins"]

[[bin]]
name = "bench_startup"
path = "src/dev_bin/bench_startup.rs"
required-features = ["dev-bins"]

[[bin]]
name = "bench_covers"
path = "src/dev_bin/bench_covers.rs"
required-features = ["dev-bins"]

[[bin]]
name = "waveform_fixtures"
path = "src/dev_bin/waveform_fixtures.rs"
required-features = ["dev-bins"]

[[bin]]
name = "waveform_detail_dump"
path = "src/dev_bin/waveform_detail_dump.rs"
required-features = ["dev-bins"]

[[bin]]
name = "waveform_window_dump"
path = "src/dev_bin/waveform_window_dump.rs"
required-features = ["dev-bins"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
fourfour-stretch = { path = "../fourfour-stretch", features = ["count-allocs"] }
