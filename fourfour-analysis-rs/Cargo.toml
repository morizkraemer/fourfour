[package]
name = "fourfour-analysis-rs"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "fourfour_analysis"
path = "src/lib.rs"

[dependencies]
beat-this = { version = "=1.1.0", default-features = false, features = ["decode", "serde"] }
symphonia = { version = "0.6", features = ["all"] }
rustfft = "6.2"
serde_json = "1"
rten = "=0.24.0"
rten-tensor = "=0.24.0"
anyhow = "1"
pioneer-usb-writer = { path = "../pioneer-usb-writer" }
